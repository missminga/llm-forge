# SFT 实验 001：Qwen2.5-0.5B-Instruct + LoRA
# 数据：LLaMA-Factory 内置开源数据集（identity 本地文件 + alpaca 中文/英文 demo，
#       训练时自动从 HuggingFace 下载，远程机器走 HF_ENDPOINT=https://hf-mirror.com）
# 运行（在远程项目根目录 /aicc/userData/menghan/code/llm-forge 下）：
#   HF_ENDPOINT=https://hf-mirror.com .venv/bin/llamafactory-cli train configs/sft/qwen25_0.5b_lora_sft.yaml

### model
model_name_or_path: models/Qwen2.5-0.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: all

### dataset
dataset_dir: third_party/LLaMA-Factory/data   # 复用 LLaMA-Factory 自带数据集定义
dataset: identity,alpaca_zh_demo,alpaca_en_demo
template: qwen
cutoff_len: 1024
max_samples: 3000
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: outputs/sft/qwen25-0.5b-instruct-lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
