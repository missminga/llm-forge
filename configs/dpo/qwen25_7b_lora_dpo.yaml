# DPO 实验 004：7B SFT 模型 + LoRA DPO
# 运行：HF_ENDPOINT=https://hf-mirror.com .venv/bin/llamafactory-cli train configs/dpo/qwen25_7b_lora_dpo.yaml

### model（起点是合并后的 7B SFT 模型）
model_name_or_path: models/Qwen2.5-7B-Instruct-sft
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset_dir: third_party/LLaMA-Factory/data
dataset: dpo_mix_zh
template: qwen
cutoff_len: 1024
max_samples: 3000
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: outputs/dpo/qwen25-7b-instruct-lora
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true
report_to: none

### train（DPO 双路前向更吃显存，batch 再减半）
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
